version: 2
before:
  hooks:
  - go mod download
builds:
- main: .
  binary: grpc_health_probe
  flags: 
  - -trimpath
  - -tags=netgo
  ldflags: 
  - -s -w 
  - -X "main.versionTag={{.Version}}"
  env:
  - CGO_ENABLED=0
  mod_timestamp: "{{ .CommitTimestamp }}"
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - "386"
  - amd64
  - arm
  - arm64
  - ppc64le
  - s390x
  - riscv64
  ignore:
  - {goos: "darwin", goarch: "386"}
  - {goos: "darwin", goarch: "riscv64"}
  - {goos: "windows", goarch: "386"}
  - {goos: "windows", goarch: "arm"}
  - {goos: "windows", goarch: "riscv64"}
  goarm: ["6"]
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
archives:
  - formats: [ binary ]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

sboms:  # See https://goreleaser.com/customization/sbom/
  - artifacts: binary
    documents:
    - '{{ trimsuffix .Binary ".exe" }}-{{ .Os }}-{{ .Arch }}.sbom.json'

dockers_v2:  # See https://goreleaser.com/customization/package/dockers_v2/
  - dockerfile: Dockerfile
    build_args:
      BINARY_FROM: prebuilt
      SOURCE_DATE_EPOCH: '{{ .CommitTimestamp }}'  # image creation time
    # buildx's provenance and SBOM would vary the digest (build ID, timestamps);
    # release.yml attests both, signed, outside the image instead.
    sbom: false
    flags:
    - --provenance=false
    # Clamp file times in the layer to SOURCE_DATE_EPOCH: GoReleaser's build
    # context and COPY's parent directory carry the build time. --push merges
    # into this output; unpack=false lets Docker Desktop's image store --load it.
    - --output=type=image,rewrite-timestamp=true,unpack=false
    images:
    - '{{ .Env.IMAGE_REPO }}'
    tags:
    - '{{ .Tag }}'
    platforms:
    - linux/amd64
    - linux/arm/v6
    - linux/arm64
    - linux/ppc64le
    - linux/s390x

release:
  footer: |
    **Container Image** in [{{ .Env.IMAGE_REPO }}](https://{{ .Env.IMAGE_REPO }}): `{{ .Env.IMAGE_REPO }}:{{ .Tag }}`

    **Verify** the signed build provenance with the [GitHub CLI](https://cli.github.com/). `<file>` is any binary or `.sbom.json` listed in `checksums.txt`, e.g. `grpc_health_probe-linux-arm64`:
    ```sh
    gh attestation verify <file> -R grpc-ecosystem/grpc-health-probe
    gh attestation verify oci://{{ .Env.IMAGE_REPO }}:{{ .Tag }} -R grpc-ecosystem/grpc-health-probe
    gh attestation verify oci://{{ .Env.IMAGE_REPO }}:{{ .Tag }} -R grpc-ecosystem/grpc-health-probe --predicate-type https://spdx.dev/Document
    ```
    Without GitHub's attestation API, verify against the `checksums.txt.sigstore.json` bundle from this release:
    ```sh
    gh attestation verify <file> --bundle checksums.txt.sigstore.json -R grpc-ecosystem/grpc-health-probe
    ```

    **Full Changelog**: https://github.com/grpc-ecosystem/grpc-health-probe/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Open Source Insights**: [{{ .Tag }}](https://deps.dev/go/github.com%2Fgrpc-ecosystem%2Fgrpc-health-probe/{{ .Tag }}) (compare to [{{ .PreviousTag }}](https://deps.dev/go/github.com%2Fgrpc-ecosystem%2Fgrpc-health-probe/{{ .PreviousTag }}/compare?v2={{ .Tag }}))
