name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-latest]
        race: [-race]
        include:
        - os: windows-11-arm # the race detector doesn't support windows/arm64
          race: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # git checkout

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Test
      shell: bash
      env:
        RACE: ${{ matrix.race }}
      run: |
        # $RACE is unquoted so that it disappears where it's empty.
        # shellcheck disable=SC2086
        go test $RACE -cover ./...
        # The e2e tests are unix-only; on Windows they'd leave no coverage data.
        if [ "$RUNNER_OS" != Windows ]; then
          export GOCOVERDIR="$RUNNER_TEMP/covdata"
          mkdir -p "$GOCOVERDIR"
          # shellcheck disable=SC2086
          go test $RACE ./internal/e2e
          go tool covdata percent -i="$GOCOVERDIR"
        fi

  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read # git checkout

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: latest
        args: release --snapshot --clean --skip ko
      env:
        KO_DOCKER_REPO: "dummy"
