name: release
on:
  push:
    tags:
    - 'v*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser: create the GitHub release and upload assets
      packages: write # GoReleaser: push container images to ghcr.io
      id-token: write # sign the attestations with Sigstore
      attestations: write # store the attestations

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    # The image only COPYs the cross-compiled binaries, so no QEMU is needed.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # GoReleaser's sboms (.goreleaser.yml) and the image SBOM below run syft.
    - name: Install Syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    - name: Binary builds with GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPO: "ghcr.io/${{ github.repository }}"

    # Signed SLSA provenance and SBOM, kept outside the image (buildx's own are
    # off in .goreleaser.yml) so the image digest stays reproducible.
    # Verify with: gh attestation verify <file or oci://image:tag> -R grpc-ecosystem/grpc-health-probe
    # (add --predicate-type https://spdx.dev/Document for the image SBOM)
    - name: Attest binaries
      id: attest-binaries
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: dist/checksums.txt
    - name: Resolve image digest
      id: image
      env:
        IMAGE: "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
      run: echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
    - name: Attest image
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ steps.image.outputs.digest }}
        push-to-registry: true
    # Every platform image holds the same binary built for another arch, so
    # the linux/amd64 SBOM stands for the index.
    - name: Image SBOM
      env:
        IMAGE: "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"
      run: syft "registry:$IMAGE" --platform linux/amd64 --output spdx-json="$RUNNER_TEMP/grpc_health_probe-image.sbom.json"
    - name: Attest image SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ steps.image.outputs.digest }}
        sbom-path: ${{ runner.temp }}/grpc_health_probe-image.sbom.json
        push-to-registry: true
    # Release assets: the image SBOM next to the per-binary ones, and the
    # binaries' provenance bundle for verification without GitHub's API.
    - name: Upload image SBOM and provenance bundle
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUNDLE: ${{ steps.attest-binaries.outputs.bundle-path }}
      run: |
        cp "$BUNDLE" "$RUNNER_TEMP/checksums.txt.sigstore.json"
        gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
          "$RUNNER_TEMP/grpc_health_probe-image.sbom.json" \
          "$RUNNER_TEMP/checksums.txt.sigstore.json"
